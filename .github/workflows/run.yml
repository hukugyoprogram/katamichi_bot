name: Katamichi GO Checker

on:
  schedule:
    # 10分ごとに自動巡回（必要に応じて間隔を調整可能）
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  check-slots:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 tweepy python-dotenv

      - name: Run script
        env:
          API_KEY: ${{ secrets.API_KEY }}
          API_SECRET: ${{ secrets.API_SECRET }}
          ACCESS_TOKEN: ${{ secrets.ACCESS_TOKEN }}
          ACCESS_TOKEN_SECRET: ${{ secrets.ACCESS_TOKEN_SECRET }}
        run: |
          python katamichi_bot.py

      - name: Commit and push history
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add posted_slots.json
          if ! git diff --quiet --cached; then
            git commit -m "Update posted slots history"
            git pull origin main --no-rebase -X ours || true
            git push origin main || echo "Push failed, will retry next run"
          fi
